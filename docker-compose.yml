# Our 52 — reproducible local / self-hosted stack (SQLite, single app service).
# Usage: cp .env.example .env  (adjust secrets)  then  docker compose up --build
# App:   http://localhost:8080   ·   API: http://localhost:4000
#
# Storage is a single SQLite file on the `our52_data` volume — no database
# service to run. The app service applies migrations, seeds the couple, serves
# the API, and runs the scheduling worker inline (RUN_WORKER defaults true).

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/data/our52.db
      PORT: 4000
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      SESSION_SECRET: ${SESSION_SECRET:-please-change-this-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      DEMO_MODE: ${DEMO_MODE:-true}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_SESSION_DIR: /data/whatsapp
    volumes:
      - our52_data:/data
    ports:
      - "4000:4000"
    # start:prod = migrate deploy + seed (idempotent) + API with inline worker.

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      - app
    environment:
      API_UPSTREAM: app:4000
    ports:
      - "8080:80"

volumes:
  our52_data:
